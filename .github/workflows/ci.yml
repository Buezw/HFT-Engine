name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build + run correctness tests (gcc)
        run: make test

      - name: Build + run benchmark (gcc)
        run: make bench

      - name: Build + run correctness tests under ASan/UBSan (clang)
        run: make asan

      - name: Static analysis (cppcheck)
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          make cppcheck
